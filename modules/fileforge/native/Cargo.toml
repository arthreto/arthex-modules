[package]
name = "fileforge"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
arthex-module = { path = "../../../arthex/sdk/native" }
base64 = "0.22"
lopdf = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
