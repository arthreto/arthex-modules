name: yt-dlp

# Sites change their pages often: the Downloader follows the latest yt-dlp, once its hashes are checked
# against the signature of its authors. Pushes made here start no workflow, so the release is asked for.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - id: update
        shell: bash
        run: node modules/downloader/native/update-tools.mjs
      - if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name arthreto
          git config user.email 86776616+arthreto@users.noreply.github.com
          git add modules/downloader/manifest.ts modules/downloader/sites.json modules/downloader/native/tools.json
          git commit -m "Follow yt-dlp $(node -p "require('./modules/downloader/native/tools.json').ytdlp.tag")"
          git push
          gh workflow run release.yml --ref main
