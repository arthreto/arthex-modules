[package]
name = "remote"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
arthex-module = { path = "../../../arthex/sdk/native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
cloud-filter = "0.0.7"
nt-time = "0.15"
rfd = "0.15"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "4"
suppaftp = { version = "13", features = ["native-tls"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
