[package]
name = "discord-rpc"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
arthex-module = { path = "../../../arthex/sdk/native" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
