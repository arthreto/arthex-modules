[package]
name = "tts"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
arthex-module = { path = "../../../arthex/sdk/native" }
base64 = "0.22"
bzip2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Its libraries go next to the program (`prepare.mjs`): their static build on Windows uses the
# static C runtime, which cannot be linked with the other C code of the program.
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["shared"] }
tar = { version = "0.4", default-features = false }
ureq = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
